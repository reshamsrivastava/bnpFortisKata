    # H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:bookstoredb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=admin
spring.datasource.password=admin123

# H2 Console Configuration (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop is used for the in-memory H2 database so that the Book entity
# schema and seed data are available as soon as the application starts.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

#logging
logging.level.root=INFO
logging.level.com.bnppf.bookstore=DEBUG